[project]
name = "affiliate-workbench-backend"
version = "0.1.0"
description = "New-energy vehicle repair franchise operations workbench API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1.0",
  "httpx>=0.28,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "openpyxl>=3.1,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "python-pptx>=0.6.23,<2.0",
  "reportlab>=4.2,<5.0",
  "uvicorn[standard]>=0.30,<1.0",
  "PyJWT[crypto]>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9.0",
  "PyMuPDF>=1.24,<2.0",
]
postgres = [
  "psycopg[binary]>=3.2,<4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]
